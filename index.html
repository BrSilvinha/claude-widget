<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      overflow: hidden;
      height: 270px;
      width: 320px;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      width: 320px;
      background: rgba(28, 28, 35, 0.92);
      backdrop-filter: blur(60px) saturate(180%);
      -webkit-backdrop-filter: blur(60px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 16px;
      padding: 18px 18px 14px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.08);
      -webkit-app-region: drag;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
    }
    .logo { width: 26px; height: 26px; flex-shrink: 0; }
    .brand-name {
      font-size: 13px; font-weight: 600; letter-spacing: .3px;
      color: rgba(255,255,255,0.9);
    }
    .brand-plan {
      font-size: 11px; color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.07);
      padding: 1px 7px; border-radius: 20px;
    }
    .win-btn {
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 11px; color: rgba(255,255,255,0.4);
      -webkit-app-region: no-drag;
      transition: background .15s, color .15s;
    }
    .win-btn.minimize:hover { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }
    .win-btn.close:hover    { background: rgba(255,80,80,0.25); color: #ff8080; }

    /* ── Limit block ── */
    .block { margin-bottom: 12px; }
    .block-header {
      display: flex; align-items: baseline;
      justify-content: space-between; margin-bottom: 6px;
    }
    .block-label {
      font-size: 11px; color: rgba(255,255,255,0.4);
      letter-spacing: .2px;
    }
    .block-right {
      display: flex; align-items: baseline; gap: 6px;
    }
    .pct {
      font-size: 20px; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .pct-unit { font-size: 12px; color: rgba(255,255,255,0.35); font-weight: 400; }

    .pct-ok   { color: #4ade80; }
    .pct-mid  { color: #facc15; }
    .pct-high { color: #f87171; }

    /* Track */
    .track {
      height: 5px; background: rgba(255,255,255,0.08);
      border-radius: 99px; overflow: hidden; margin-bottom: 4px;
    }
    .fill {
      height: 100%; border-radius: 99px; min-width: 4px;
      transition: width .8s cubic-bezier(0.34,1.56,0.64,1);
    }
    .fill-green  { background: linear-gradient(90deg,#4ade80,#22c55e); box-shadow: 0 0 8px rgba(74,222,128,.4); }
    .fill-yellow { background: linear-gradient(90deg,#facc15,#f59e0b); box-shadow: 0 0 8px rgba(250,204,21,.35); }
    .fill-red    { background: linear-gradient(90deg,#f87171,#ef4444); box-shadow: 0 0 8px rgba(248,113,113,.4); }
    .fill-blue   { background: linear-gradient(90deg,#60a5fa,#3b82f6); box-shadow: 0 0 8px rgba(96,165,250,.3); }

    .sub-text {
      font-size: 10px; color: rgba(255,255,255,0.25);
    }

    /* ── Divider ── */
    .sep {
      height: 1px; background: rgba(255,255,255,0.07);
      margin: 10px 0;
    }

    /* ── Token rows ── */
    .tokens { display: flex; gap: 8px; }
    .tok-card {
      flex: 1; background: rgba(255,255,255,0.05);
      border-radius: 10px; padding: 7px 10px;
    }
    .tok-label { font-size: 9px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: .8px; }
    .tok-val { font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.85); line-height: 1.3; font-variant-numeric: tabular-nums; }
    .tok-unit { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 400; }

    /* ── Footer ── */
    .footer {
      margin-top: 8px;
      font-size: 9px; color: rgba(255,255,255,0.18); text-align: right;
    }
  </style>
</head>
<body>
<div class="card">

  <div class="header">
    <div class="brand">
      <img class="logo" id="brand-logo" src="" alt="" style="display:none; border-radius:6px;"/>
      <span class="brand-name">Claude</span>
      <span class="brand-plan">Pro</span>
    </div>
    <div style="display:flex;gap:5px;-webkit-app-region:no-drag">
      <div class="win-btn minimize" onclick="window.claude.minimize()" title="Minimizar">─</div>
      <div class="win-btn close"    onclick="window.claude.close()"    title="Cerrar">✕</div>
    </div>
  </div>

  <!-- Sesion actual -->
  <div class="block">
    <div class="block-header">
      <span class="block-label">Sesion actual</span>
      <div class="block-right">
        <span class="pct pct-ok" id="sess-pct">—</span>
        <span class="pct-unit">%</span>
      </div>
    </div>
    <div class="track"><div class="fill fill-green" id="sess-fill" style="width:0%"></div></div>
    <div class="sub-text" id="sess-reset">cargando...</div>
  </div>

  <!-- Semanal -->
  <div class="block" style="margin-bottom:0">
    <div class="block-header">
      <span class="block-label">Esta semana</span>
      <div class="block-right">
        <span class="pct pct-ok" id="week-pct">—</span>
        <span class="pct-unit">%</span>
      </div>
    </div>
    <div class="track"><div class="fill fill-blue" id="week-fill" style="width:0%"></div></div>
    <div class="sub-text" id="week-reset">cargando...</div>
  </div>

  <div class="sep"></div>

  <!-- Tokens -->
  <div class="tokens">
    <div class="tok-card">
      <div class="tok-label">Hoy</div>
      <div class="tok-val" id="tok-today">—<span class="tok-unit"> tok</span></div>
    </div>
    <div class="tok-card">
      <div class="tok-label">Este mes</div>
      <div class="tok-val" id="tok-month">—<span class="tok-unit"> tok</span></div>
    </div>
  </div>

  <div class="footer" id="footer">actualizando...</div>
</div>

<script>
  function fmt(n) {
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
    return n.toString();
  }

  function applyPct(pctEl, fillEl, pct, useBlue) {
    const cls = pct >= 80 ? 'pct-high' : pct >= 50 ? 'pct-mid' : 'pct-ok';
    const fillCls = useBlue ? 'fill-blue'
      : pct >= 80 ? 'fill-red'
      : pct >= 50 ? 'fill-yellow'
      : 'fill-green';

    pctEl.textContent = pct;
    pctEl.className = 'pct ' + cls;
    fillEl.style.width = Math.max(pct, 1) + '%';
    fillEl.className = 'fill ' + fillCls;
  }

  function render({ stats, limits }) {
    if (limits?.session) {
      applyPct(
        document.getElementById('sess-pct'),
        document.getElementById('sess-fill'),
        limits.session.pct, false
      );
      document.getElementById('sess-reset').textContent =
        'a las ' + limits.session.resetsAtExact + '  ·  en ' + limits.session.resetsIn;
    }

    if (limits?.weekly) {
      applyPct(
        document.getElementById('week-pct'),
        document.getElementById('week-fill'),
        limits.weekly.pct, true
      );
      document.getElementById('week-reset').textContent = 'Reinicia ' + limits.weekly.resetsAt;
    }

    if (stats) {
      document.getElementById('tok-today').innerHTML =
        fmt(stats.today) + '<span class="tok-unit"> tok</span>';
      document.getElementById('tok-month').innerHTML =
        fmt(stats.month) + '<span class="tok-unit"> tok</span>';
    }

    const now = new Date();
    document.getElementById('footer').textContent =
      'act. ' + now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
  }

  window.claude.getData().then(render);
  window.claude.onData(render);

  // Cargar logo real de Claude
  window.claude.getIconPath().then(dataUrl => {
    if (dataUrl) {
      const img = document.getElementById('brand-logo');
      img.src = dataUrl;
      img.style.display = 'block';
    }
  });
</script>
</body>
</html>
